<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      color: white;
      overflow: hidden;
    }

    /* Background Image */
    #bgImage {
      position: fixed;
      inset: 0;
      background-image: url("/images/legacy/logo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: zoomInOut 8s ease-in-out infinite alternate;
      opacity: 0.5;
      z-index: 0;
    }

    /* Dark overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1;
    }

    @keyframes zoomInOut {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    /* Login Box */
    .login-box {
      position: relative;
      z-index: 2;
      width: 320px;
      padding: 30px;
      background: rgba(20,20,20,0.9);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,188,212,0.4);
    }

    .login-box h2 {
      color: #00bcd4;
      margin-bottom: 20px;
    }

    .login-box .subtitle {
      color: #888;
      font-size: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      box-sizing: border-box;
      background: #333;
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #666;
    }

    input:focus {
      outline: 2px solid #00bcd4;
    }

    .role-selector {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .role-selector button {
      flex: 1;
      padding: 10px;
      margin: 0;
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .role-selector button.active {
      border-color: #00bcd4;
      background: #1a3a3a;
    }

    .role-selector button:hover {
      border-color: #00bcd4;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #00bcd4;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0097a7;
    }

    #loading {
      display: none;
      margin-top: 10px;
      color: #00e5ff;
      font-size: 14px;
    }

    .student-list {
      margin-top: 15px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      font-size: 11px;
      color: #666;
      text-align: left;
    }

    .student-list span {
      color: #4a9eff;
    }

    .error {
      color: #ff4444;
      margin-top: 8px;
      font-size: 13px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div id="bgImage"></div>

  <!-- Login UI -->
  <div class="login-box">
    <h2>🎓 UMES VR</h2>
    <p class="subtitle">Enter your name to join the classroom</p>

    <input id="username" placeholder="Enter your name..." autofocus>

    <div class="role-selector">
      <button id="student-role" class="active" onclick="setRole('student')">🎒 Student</button>
      <button id="instructor-role" onclick="setRole('instructor')">👨‍🏫 Instructor</button>
    </div>

    <button onclick="login()">🚀 Enter Classroom</button>

    <div class="error" id="error"></div>
    <div id="loading">Loading...</div>

    <div class="student-list">
      💡 Available: <span>Tina, Sager, Devika, Nyles, Ahmed, Tina1, Sager1, Devika1, Nyles1, Ahmed1</span>
    </div>
  </div>

<script>
  let selectedRole = "student";

  window.setRole = function (role) {
    selectedRole = role;

    document.getElementById("student-role").className =
      role === "student" ? "active" : "";

    document.getElementById("instructor-role").className =
      role === "instructor" ? "active" : "";
  };

  window.login = async function () {
    const usernameInput = document.getElementById("username");
    const errorElement = document.getElementById("error");
    const loadingElement = document.getElementById("loading");

    const username = usernameInput.value.trim();

    errorElement.textContent = "";

    if (!username) {
      errorElement.textContent = "⚠️ Please enter your name";
      return;
    }

    loadingElement.textContent = "Checking user...";
    loadingElement.style.display = "block";

    console.log(
      `[Login] Logging in as ${username} with role ${selectedRole}`
    );

    try {
     const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          role: selectedRole
        })
      });

      const data = await response.json();

      console.log("[Login] Server response:", data);

      if (!response.ok || !data.success || !data.user) {
        throw new Error(
          data.message ||
          data.error ||
          "Login failed."
        );
      }

      const vrUser = {
        id: Number(data.user.id),
        username: data.user.username,
        fullName:
          data.user.fullName ||
          data.user.username,
        role: data.user.role,
        seat: data.user.seat ?? null,
        location:
          data.user.location ||
          "classroom",
        loginTime: new Date().toISOString()
      };

      if (!Number.isInteger(vrUser.id)) {
        throw new Error(
          "The server did not return a valid user ID."
        );
      }

      localStorage.removeItem("seat");

      localStorage.setItem(
        "vrUser",
        JSON.stringify(vrUser)
      );

      console.log("[Login] Saved vrUser:", vrUser);
      console.log(
        "[Login] Storage verification:",
        localStorage.getItem("vrUser")
      );

      loadingElement.textContent =
        vrUser.role === "instructor"
          ? "Loading instructor classroom..."
          : "Loading classroom...";

      window.location.href = "/";
    } catch (loginError) {
      console.error("[Login] Error:", loginError);

      loadingElement.style.display = "none";

      errorElement.textContent =
        `⚠️ ${loginError.message}`;
    }
  };

  document
    .getElementById("username")
    .addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        window.login();
      }
    });

  document
    .getElementById("username")
    .focus();

  console.log("[Login] Login page ready");
</script>

</body>
</html>
